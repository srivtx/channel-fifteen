s, 'Liberation Mono', monospace" font-size="17" fill="#1B1A17" text-anchor="middle" font-weight="bold" >00</text><rect x="692.0" y="360.0" width="60.0" height="60.0" rx="6" fill="#2C4FA3" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="722.0" y="396.1" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1B1A17" text-anchor="middle" font-weight="bold" >0E</text><rect x="760.0" y="360.0" width="60.0" height="60.0" rx="6" fill="#E0462F" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="790.0" y="396.1" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1B1A17" text-anchor="middle" font-weight="bold" >3C</text><path d="M80.0,426.0 L80.0,433.0 L140.0,433.0 L140.0,426.0" stroke="#E0462F" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="110.0" y="449.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#E0462F" text-anchor="middle" font-weight="bold" >start 3E</text><path d="M148.0,426.0 L148.0,433.0 L752.0,433.0 L752.0,426.0" stroke="#2C4FA3" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="450.0" y="449.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2C4FA3" text-anchor="middle" font-weight="bold" >body</text><path d="M760.0,426.0 L760.0,433.0 L820.0,433.0 L820.0,426.0" stroke="#E0462F" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="790.0" y="449.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#E0462F" text-anchor="middle" font-weight="bold" >end 3C</text><text x="80.0" y="520.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="bold" >…BUT WHAT IF THE BODY CONTAINS 3C?  ESCAPE IT (byte stuffing)</text><rect x="80.0" y="550.0" width="60.0" height="60.0" rx="6" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.4" fill-opacity="1"/><text x="110.0" y="586.1" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1B1A17" text-anchor="middle" font-weight="bold" >12</text><rect x="148.0" y="550.0" width="60.0" height="60.0" rx="6" fill="#E0462F" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="178.0" y="586.1" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1B1A17" text-anchor="middle" font-weight="bold" >3C</text><rect x="216.0" y="550.0" width="60.0" height="60.0" rx="6" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.4" fill-opacity="1"/><text x="246.0" y="586.1" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1B1A17" text-anchor="middle" font-weight="bold" >34</text><path d="M148.0,616.0 L148.0,623.0 L208.0,623.0 L208.0,616.0" stroke="#E0462F" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="178.0" y="639.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#E0462F" text-anchor="middle" font-weight="bold" >would end the frame!</text><line x1="296.0" y1="580.0" x2="396.0" y2="580.0" stroke="#1B1A17" stroke-width="2"  stroke-linecap="round" /><path d="M396.0,580.0 L387.7,583.5 L387.7,576.5 Z" fill="#1B1A17"/><rect x="416.0" y="550.0" width="60.0" height="60.0" rx="6" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.4" fill-opacity="1"/><text x="446.0" y="586.1" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1B1A17" text-anchor="middle" font-weight="bold" >12</text><rect x="484.0" y="550.0" width="60.0" height="60.0" rx="6" fill="#2E8B57" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="514.0" y="586.1" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1B1A17" text-anchor="middle" font-weight="bold" >3D</text><rect x="552.0" y="550.0" width="60.0" height="60.0" rx="6" fill="#2E8B57" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="582.0" y="586.1" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1B1A17" text-anchor="middle" font-weight="bold" >2C</text><rect x="620.0" y="550.0" width="60.0" height="60.0" rx="6" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.4" fill-opacity="1"/><text x="650.0" y="586.1" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1B1A17" text-anchor="middle" font-weight="bold" >34</text><path d="M484.0,616.0 L484.0,623.0 L612.0,623.0 L612.0,616.0" stroke="#2E8B57" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="548.0" y="639.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2E8B57" text-anchor="middle" font-weight="bold" >3D + (3C with bit 4 cleared)</text><text x="80.0" y="700.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="bold" >C · AND WHEN BYTES GO MISSING?</text><text x="80.0" y="726.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >Length-first: a wrong length swallows the next message. Every decoder therefore checks what it can (end byte,</text><text x="80.0" y="748.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >checksum, sane length ≤ 4096) and, if anything is off, drops ONE byte and hunts for the next start byte.</text><text x="80.0" y="820.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >A Bluetooth serial channel is a stream, like water in a pipe: it delivers bytes in order but has no idea where one message stops and the next begins. Two writes can arrive as one chunk; one</text><text x="80.0" y="840.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >write can arrive in two. Every protocol in this manual solves that with one of these two tricks.</text><rect x="0" y="0" width="1500" height="1060" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1464.0" height="1024.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1448.0" height="1008.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 30</text><circle cx="1448.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1437.0" y1="44.0" x2="1459.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1448.0" y1="33.0" x2="1448.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="1016.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="1016.0" x2="55.0" y2="1016.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="1005.0" x2="44.0" y2="1027.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="1004.0" y="970.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="1004.0" y1="1004.0" x2="1474.0" y2="1004.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><line x1="1378.0" y1="970.0" x2="1378.0" y2="1034.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="1016.0" y="993.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >Where does a message end?</text><text x="1016.0" y="1023.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot field manual · 08 · integrity</text><text x="1426.0" y="988.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >Plate</text><text x="1426.0" y="1000.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >30 / 43</text><text x="1426.0" y="1023.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#6F685C" text-anchor="middle" font-weight="normal" >framing</text></svg>