<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920"><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 -1.6 1.05"/></filter><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.05" fill="#1B1A17"/></pattern></defs><rect x="0.0" y="0.0" width="1400.0" height="920.0" rx="0" fill="#EFE8D8" stroke="none" stroke-width="0" /><rect x="90.0" y="150.0" width="560.0" height="316.0" rx="12" fill="#1B1A17" stroke="none" stroke-width="0" /><rect x="80.0" y="140.0" width="560.0" height="316.0" rx="12" fill="#EFE8D8" stroke="#1B1A17" stroke-width="2" /><rect x="80.0" y="140.0" width="560.0" height="46.0" rx="12" fill="#2C4FA3" stroke="none" stroke-width="0" /><rect x="80.0" y="170.0" width="560.0" height="16.0" rx="0" fill="#2C4FA3" stroke="none" stroke-width="0" /><text x="100.0" y="170.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#EFE8D8" text-anchor="start" font-weight="bold" >macOS KNOWS THESE PROFILES</text><text x="100.0" y="224.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="start" font-weight="bold" >A2DP</text><text x="100.0" y="244.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >music, one way, compressed: SBC or AAC on a Mac</text><text x="100.0" y="280.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="start" font-weight="bold" >AVRCP</text><text x="100.0" y="300.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >play / pause / skip and volume</text><text x="100.0" y="336.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="start" font-weight="bold" >HFP</text><text x="100.0" y="356.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >calls: the mic, at low quality (mSBC / CVSD)</text><text x="100.0" y="392.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="start" font-weight="bold" >SPP</text><text x="100.0" y="412.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >a plain serial port – exists, but nothing uses it here</text><text x="100.0" y="438.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#2C4FA3" text-anchor="start" font-weight="bold" >→ connects these automatically</text><rect x="770.0" y="150.0" width="560.0" height="316.0" rx="12" fill="#1B1A17" stroke="none" stroke-width="0" /><rect x="760.0" y="140.0" width="560.0" height="316.0" rx="12" fill="#EFE8D8" stroke="#1B1A17" stroke-width="2" /><rect x="760.0" y="140.0" width="560.0" height="46.0" rx="12" fill="#E0462F" stroke="none" stroke-width="0" /><rect x="760.0" y="170.0" width="560.0" height="16.0" rx="0" fill="#E0462F" stroke="none" stroke-width="0" /><text x="780.0" y="170.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#EFE8D8" text-anchor="start" font-weight="bold" >macOS HAS NO IDEA ABOUT THIS ONE</text><text x="780.0" y="224.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="start" font-weight="bold" >oppointeraction</text><text x="780.0" y="244.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >realme&#x27;s control service, RFCOMM channel 15</text><text x="780.0" y="280.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="start" font-weight="bold" >UUID 0000079A-D102-…</text><text x="780.0" y="300.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >a 128-bit name no Apple code recognises</text><text x="780.0" y="336.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="start" font-weight="bold" >settings protocol</text><text x="780.0" y="356.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >battery, ANC, EQ, taps, find-my-buds</text><text x="780.0" y="392.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="start" font-weight="bold" >nobody listening</text><text x="780.0" y="412.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >…until Earshot opens it</text><text x="780.0" y="438.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#E0462F" text-anchor="start" font-weight="bold" >→ Earshot&#x27;s whole reason to exist</text><text x="80.0" y="560.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="bold" >AUDIO CODECS – HOW MUSIC IS SQUEEZED FOR THE AIR</text><rect x="80.0" y="580.0" width="290.0" height="92.0" rx="10" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.4" /><text x="98.0" y="614.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1B1A17" text-anchor="start" font-weight="bold" >SBC</text><text x="98.0" y="638.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >mandatory · ≈ 345 kbit/s</text><text x="98.0" y="660.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#2E8B57" text-anchor="start" font-weight="bold" >on a Mac ✓</text><rect x="390.0" y="580.0" width="290.0" height="92.0" rx="10" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.4" /><text x="408.0" y="614.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1B1A17" text-anchor="start" font-weight="bold" >AAC</text><text x="408.0" y="638.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >Apple&#x27;s choice · ≈ 256 kbit/s</text><text x="408.0" y="660.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#2E8B57" text-anchor="start" font-weight="bold" >on a Mac ✓</text><rect x="700.0" y="580.0" width="290.0" height="92.0" rx="10" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.4" /><text x="718.0" y="614.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1B1A17" text-anchor="start" font-weight="bold" >LDAC</text><text x="718.0" y="638.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >Sony · up to 990 kbit/s</text><text x="718.0" y="660.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#E0462F" text-anchor="start" font-weight="bold" >not on a Mac</text><rect x="1010.0" y="580.0" width="290.0" height="92.0" rx="10" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.4" /><text x="1028.0" y="614.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1B1A17" text-anchor="start" font-weight="bold" >LHDC 5.0</text><text x="1028.0" y="638.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >realme&#x27;s Hi-Res · up to ≈ 1 Mbit/s</text><text x="1028.0" y="660.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#E0462F" text-anchor="start" font-weight="bold" >not on a Mac</text><text x="80.0" y="730.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >When you pick the buds in the Bluetooth menu, macOS connects the profiles it understands – audio and remote control – and stops there. The settings live behind a vendor</text><text x="80.0" y="750.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >service that no Mac software asks for. Earshot&#x27;s “Hi-Res audio” switch still works: it tells the buds to offer LHDC to phones that support it. The Mac itself stays on</text><text x="80.0" y="770.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >AAC.</text><rect x="0" y="0" width="1400" height="920" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1364.0" height="884.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1348.0" height="868.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 21</text><circle cx="1348.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1337.0" y1="44.0" x2="1359.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1348.0" y1="33.0" x2="1348.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="876.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="876.0" x2="55.0" y2="876.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="865.0" x2="44.0" y2="887.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="904.0" y="830.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="904.0" y1="864.0" x2="1374.0" y2="864.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><line x1="1278.0" y1="830.0" x2="1278.0" y2="894.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="916.0" y="853.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >Why a Mac plays music but can&#x27;t change settings</text><text x="916.0" y="883.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot field manual · 04 · the stack</text><text x="1326.0" y="848.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >Plate</text><text x="1326.0" y="860.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >21 / 43</text><text x="1326.0" y="883.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#6F685C" text-anchor="middle" font-weight="normal" >profiles</text></svg>