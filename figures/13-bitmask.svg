" font-weight="normal" >bit 7</text><text x="158.0" y="534.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#1B1A17" text-anchor="middle" font-weight="bold" >charging</text><rect x="204.0" y="420.0" width="76.0" height="76.0" rx="8.0" fill="#E0462F"/><text x="242.0" y="467.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="26" fill="#EFE8D8" text-anchor="middle" font-weight="bold" >1</text><text x="242.0" y="516.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >bit 6</text><text x="242.0" y="534.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#1B1A17" text-anchor="middle" font-weight="bold" >64</text><rect x="288.0" y="420.0" width="76.0" height="76.0" rx="8.0" fill="#E4DBC6"/><text x="326.0" y="467.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="26" fill="#1B1A17" text-anchor="middle" font-weight="bold" >0</text><text x="326.0" y="516.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >bit 5</text><text x="326.0" y="534.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#1B1A17" text-anchor="middle" font-weight="bold" >32</text><rect x="372.0" y="420.0" width="76.0" height="76.0" rx="8.0" fill="#E0462F"/><text x="410.0" y="467.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="26" fill="#EFE8D8" text-anchor="middle" font-weight="bold" >1</text><text x="410.0" y="516.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >bit 4</text><text x="410.0" y="534.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#1B1A17" text-anchor="middle" font-weight="bold" >16</text><rect x="456.0" y="420.0" width="76.0" height="76.0" rx="8.0" fill="#E4DBC6"/><text x="494.0" y="467.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="26" fill="#1B1A17" text-anchor="middle" font-weight="bold" >0</text><text x="494.0" y="516.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >bit 3</text><text x="494.0" y="534.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#1B1A17" text-anchor="middle" font-weight="bold" >8</text><rect x="540.0" y="420.0" width="76.0" height="76.0" rx="8.0" fill="#E0462F"/><text x="578.0" y="467.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="26" fill="#EFE8D8" text-anchor="middle" font-weight="bold" >1</text><text x="578.0" y="516.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >bit 2</text><text x="578.0" y="534.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#1B1A17" text-anchor="middle" font-weight="bold" >4</text><rect x="624.0" y="420.0" width="76.0" height="76.0" rx="8.0" fill="#E4DBC6"/><text x="662.0" y="467.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="26" fill="#1B1A17" text-anchor="middle" font-weight="bold" >0</text><text x="662.0" y="516.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >bit 1</text><text x="662.0" y="534.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#1B1A17" text-anchor="middle" font-weight="bold" >2</text><rect x="708.0" y="420.0" width="76.0" height="76.0" rx="8.0" fill="#E0462F"/><text x="746.0" y="467.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="26" fill="#EFE8D8" text-anchor="middle" font-weight="bold" >1</text><text x="746.0" y="516.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >bit 0</text><text x="746.0" y="534.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#1B1A17" text-anchor="middle" font-weight="bold" >1</text><text x="820.0" y="452.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="24" fill="#1B1A17" text-anchor="start" font-weight="bold" >= 0xD5</text><text x="820.0" y="480.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Top bit: charging flag. Low seven bits: level. 0xD5</text><text x="820.0" y="498.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F685C" text-anchor="start" font-weight="normal" >&amp; 0x7F = 85 %, 0xD5 &amp; 0x80 ≠ 0 → charging.</text><text x="120.0" y="690.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#2C4FA3" text-anchor="start" font-weight="bold" >value &amp; mask  → test     value | mask  → set     value &amp; ~mask  → clear</text><text x="120.0" y="730.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >Protocols squeeze several yes/no answers into one byte by giving each its own bit. Reading them is arithmetic with AND (&amp;) and OR (|).</text><text x="120.0" y="750.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >Earshot does exactly this: modes.reduce(0) { $0 | code } builds the hold-cycle byte, and level &amp; 0x7F / level &amp; 0x80 split a battery byte.</text><rect x="0" y="0" width="1300" height="900" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1264.0" height="864.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1248.0" height="848.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 13</text><circle cx="1248.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1237.0" y1="44.0" x2="1259.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1248.0" y1="33.0" x2="1248.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="856.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="856.0" x2="55.0" y2="856.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="845.0" x2="44.0" y2="867.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="804.0" y="810.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="804.0" y1="844.0" x2="1274.0" y2="844.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><line x1="1178.0" y1="810.0" x2="1178.0" y2="874.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="816.0" y="833.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >Bit masks: many switches in one byte</text><text x="816.0" y="863.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot field manual · 02 · signals to bits</text><text x="1226.0" y="828.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6F685C