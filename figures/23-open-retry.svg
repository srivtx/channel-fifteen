t="20.0" rx="4.0" fill="#E0462F"/><line x1="200.0" y1="370.0" x2="200.0" y2="408.0" stroke="#E0462F" stroke-width="1"  stroke-linecap="round" /><text x="200.0" y="440.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="middle" font-weight="bold" >open #0</text><text x="200.0" y="456.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E0462F" text-anchor="middle" font-weight="normal" >refused</text><rect x="234.0" y="350.0" width="20.0" height="20.0" rx="4.0" fill="#E0462F"/><line x1="244.0" y1="350.0" x2="244.0" y2="298.0" stroke="#E0462F" stroke-width="1"  stroke-linecap="round" /><text x="244.0" y="290.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="middle" font-weight="bold" >open #1</text><text x="244.0" y="306.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E0462F" text-anchor="middle" font-weight="normal" >refused</text><rect x="322.0" y="350.0" width="20.0" height="20.0" rx="4.0" fill="#E0462F"/><line x1="332.0" y1="370.0" x2="332.0" y2="408.0" stroke="#E0462F" stroke-width="1"  stroke-linecap="round" /><text x="332.0" y="440.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="middle" font-weight="bold" >open #2</text><text x="332.0" y="456.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E0462F" text-anchor="middle" font-weight="normal" >refused</text><rect x="487.0" y="350.0" width="20.0" height="20.0" rx="4.0" fill="#E0462F"/><line x1="497.0" y1="350.0" x2="497.0" y2="298.0" stroke="#E0462F" stroke-width="1"  stroke-linecap="round" /><text x="497.0" y="290.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="middle" font-weight="bold" >open #3</text><text x="497.0" y="306.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E0462F" text-anchor="middle" font-weight="normal" >refused</text><rect x="817.0" y="350.0" width="20.0" height="20.0" rx="4.0" fill="#D9A441"/><line x1="827.0" y1="370.0" x2="827.0" y2="408.0" stroke="#D9A441" stroke-width="1"  stroke-linecap="round" /><text x="827.0" y="440.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="middle" font-weight="bold" >reset link</text><text x="827.0" y="456.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9A441" text-anchor="middle" font-weight="normal" >close + reconnect</text><rect x="1037.0" y="350.0" width="20.0" height="20.0" rx="4.0" fill="#1B1A17"/><line x1="1047.0" y1="350.0" x2="1047.0" y2="298.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="1047.0" y="290.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="middle" font-weight="bold" >reconnect</text><text x="1047.0" y="306.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1B1A17" text-anchor="middle" font-weight="normal" >connect note</text><rect x="1147.0" y="350.0" width="20.0" height="20.0" rx="4.0" fill="#2E8B57"/><line x1="1157.0" y1="370.0" x2="1157.0" y2="408.0" stroke="#2E8B57" stroke-width="1"  stroke-linecap="round" /><text x="1157.0" y="440.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="middle" font-weight="bold" >open</text><text x="1157.0" y="456.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#2E8B57" text-anchor="middle" font-weight="normal" >channel 15 ✓</text><path d="M200.0,336 Q222.0,300 244.0,336" stroke="#6F685C" stroke-width="1" fill="none" stroke-dasharray="3 3" stroke-linejoin="round" stroke-linecap="round" /><text x="222.0" y="312.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >0.4</text><path d="M244.0,336 Q288.0,300 332.0,336" stroke="#6F685C" stroke-width="1" fill="none" stroke-dasharray="3 3" stroke-linejoin="round" stroke-linecap="round" /><text x="288.0" y="312.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >0.8</text><path d="M332.0,336 Q414.5,300 497.0,336" stroke="#6F685C" stroke-width="1" fill="none" stroke-dasharray="3 3" stroke-linejoin="round" stroke-linecap="round" /><text x="414.5" y="312.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >1.5</text><path d="M497.0,336 Q662.0,300 827.0,336" stroke="#6F685C" stroke-width="1" fill="none" stroke-dasharray="3 3" stroke-linejoin="round" stroke-linecap="round" /><text x="662.0" y="312.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >3</text><text x="90.0" y="140.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >BACKOFF  0.4 · 0.8 · 1.5 · 3 · 5 · 8 · 15 s  →  then every 30 s</text><text x="90.0" y="166.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D9A441" text-anchor="start" font-weight="normal" >after 4 failed opens: close the Bluetooth link and reconnect, which clears a half-open channel</text><text x="90.0" y="188.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6F685C" text-anchor="start" font-weight="normal" >every open has a 6 s watchdog – if macOS never answers, start over rather than hang in “linking”</text><text x="90.0" y="560.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >Right after the buds connect for audio, they often refuse the first request for the control channel – they are still busy setting up. A copy of Earshot that was force-quit can also leave the</text><text x="90.0" y="580.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >channel half-open, and the buds then turn every newcomer away. BudsLink handles both: it waits a second after the connect notification, retries with growing gaps, resets the link if that</text><text x="90.0" y="600.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >clearly isn&#x27;t working, and closes the channel cleanly on quit (even on SIGTERM). In testing, kill-and-reopen cycles linked in about 0.15 s.</text><text x="90.0" y="760.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >macOS also asks once: “Earshot would like to use Bluetooth” – the NSBluetoothAlwaysUsageDescription</text><text x="90.0" y="782.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >string in Info.plist is what that dialog shows. Without a yes, IOBluetooth returns nothing at all.</text><rect x="0" y="0" width="1500" height="900" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1464.0" height="864.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1448.0" height="848.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 23</text><circle cx="1448.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1437.0" y1="44.0" x2="1459.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1448.0" y1="33.0" x2="1448.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="856.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="856.0" x2="55.0" y2="856.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="845.0" x2="44.0" y2="867.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="1004.0" y="810.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="1004.0" y1="844.0" x2="1474.0" y2="844.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><line x1="1378.0" y1="810.0" x2="1378.0" y2="874.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="1016.0" y="833.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >Opening the door, politely and persistently</text><text x="1016.0" y="863.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot field manual · 05 · macOS</text><text x="1426.0" y="828.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >Plate</text><text x="1426.0" y="840.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >23 / 43</text><text x="1426.0" y="863.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#6F685C" text-anchor="middle" font-weight="normal" >open-retry</text></svg>