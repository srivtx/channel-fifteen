<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000"><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 -1.6 1.05"/></filter><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.05" fill="#1B1A17"/></pattern></defs><rect x="0.0" y="0.0" width="1500.0" height="1000.0" rx="0" fill="#EFE8D8" stroke="none" stroke-width="0" /><text x="80.0" y="150.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="bold" >THE QUEUE  (BudsLink.queue)</text><rect x="80.0" y="200.0" width="210.0" height="90.0" rx="10" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.8" /><text x="96.0" y="234.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >0106</text><text x="96.0" y="258.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >battery?</text><text x="96.0" y="278.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6F685C" text-anchor="start" font-weight="normal" >reply 8106</text><rect x="310.0" y="200.0" width="210.0" height="90.0" rx="10" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.8" /><text x="326.0" y="234.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >0109</text><text x="326.0" y="258.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >status?</text><text x="326.0" y="278.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6F685C" text-anchor="start" font-weight="normal" >reply 8109</text><rect x="540.0" y="200.0" width="210.0" height="90.0" rx="10" fill="#E4DBC6" stroke="#2C4FA3" stroke-width="1.8" stroke-dasharray="5 4"/><text x="556.0" y="234.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#B4AB99" text-anchor="start" font-weight="bold" >0404 01 01 08</text><text x="556.0" y="258.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#B4AB99" text-anchor="start" font-weight="normal" >ANC deep</text><text x="556.0" y="278.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E0462F" text-anchor="start" font-weight="normal" >superseded</text><line x1="550.0" y1="210.0" x2="740.0" y2="280.0" stroke="#E0462F" stroke-width="2"  stroke-linecap="round" /><rect x="770.0" y="200.0" width="210.0" height="90.0" rx="10" fill="#E4DBC6" stroke="#2C4FA3" stroke-width="1.8" /><text x="786.0" y="234.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#2C4FA3" text-anchor="start" font-weight="bold" >0406 02</text><text x="786.0" y="258.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >EQ Serenade</text><text x="786.0" y="278.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6F685C" text-anchor="start" font-weight="normal" >reply 8406</text><rect x="1000.0" y="200.0" width="210.0" height="90.0" rx="10" fill="#EFE8D8" stroke="#E0462F" stroke-width="2.2" /><text x="1016.0" y="234.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E0462F" text-anchor="start" font-weight="bold" >0404 01 01 04</text><text x="1016.0" y="258.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >ANC mild (newer)</text><text x="1016.0" y="278.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E0462F" text-anchor="start" font-weight="normal" >same key → replaces</text><line x1="1100.0" y1="310.0" x2="660.0" y2="310.0" stroke="#E0462F" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round" /><path d="M660.0,310.0 L668.3,306.5 L668.3,313.5 Z" fill="#E0462F"/><text x="80.0" y="400.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="bold" >IN FLIGHT</text><rect x="80.0" y="420.0" width="260.0" height="90.0" rx="10" fill="#1B1A17" stroke="none" stroke-width="0" /><text x="100.0" y="456.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#EFE8D8" text-anchor="start" font-weight="bold" >0106 battery?</text><text x="100.0" y="484.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#CFC7BF" text-anchor="start" font-weight="normal" >waiting for 8106…</text><rect x="81.0" y="565.0" width="20.0" height="20.0" rx="5.0" fill="#2E8B57"/><text x="116.0" y="580.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="bold" >reply arrives</text><text x="380.0" y="580.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#6F685C" text-anchor="start" font-weight="normal" >clear the slot, send the next</text><rect x="81.0" y="609.0" width="20.0" height="20.0" rx="5.0" fill="#E0462F"/><text x="116.0" y="624.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="bold" >no reply in 2.5 s</text><text x="380.0" y="624.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#6F685C" text-anchor="start" font-weight="normal" >report the setting failed, re-read it, move on</text><rect x="81.0" y="653.0" width="20.0" height="20.0" rx="5.0" fill="#D9A441"/><text x="116.0" y="668.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="bold" >message expects no reply</text><text x="380.0" y="668.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#6F685C" text-anchor="start" font-weight="normal" >wait 0.15 s, then the next (subscribe, Galaxy writes)</text><rect x="81.0" y="697.0" width="20.0" height="20.0" rx="5.0" fill="#2C4FA3"/><text x="116.0" y="712.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="bold" >newer request, same key</text><text x="380.0" y="712.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#6F685C" text-anchor="start" font-weight="normal" >drop the queued one (key = command + payload minus its last byte)</text><rect x="81.0" y="741.0" width="20.0" height="20.0" rx="5.0" fill="#1B1A17"/><text x="116.0" y="756.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="bold" >every 90 s</text><text x="380.0" y="756.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#6F685C" text-anchor="start" font-weight="normal" >driver.poll(): battery and wear status</text><text x="80.0" y="830.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >Earbuds are small computers with small buffers: two commands back to back and the second is often silently dropped. So BudsLink sends one message, waits for its answer, then sends the next.</text><text x="80.0" y="850.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >Tapping through ANC strengths quickly would queue a pile of stale requests; the supersede key keeps only the newest one per setting.</text><rect x="0" y="0" width="1500" height="1000" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1464.0" height="964.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1448.0" height="948.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 38</text><circle cx="1448.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1437.0" y1="44.0" x2="1459.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1448.0" y1="33.0" x2="1448.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="956.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="956.0" x2="55.0" y2="956.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="945.0" x2="44.0" y2="967.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="1004.0" y="910.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="1004.0" y1="944.0" x2="1474.0" y2="944.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><line x1="1378.0" y1="910.0" x2="1378.0" y2="974.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="1016.0" y="933.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >One message in flight</text><text x="1016.0" y="963.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot field manual · 10 · the app</text><text x="1426.0" y="928.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >Plate</text><text x="1426.0" y="940.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >38 / 43</text><text x="1426.0" y="963.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#6F685C" text-anchor="middle" font-weight="normal" >queue</text></svg>