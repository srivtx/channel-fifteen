" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="end" font-weight="normal" >2441</text><text x="120.0" y="146.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#6F685C" text-anchor="end" font-weight="normal" >2480</text><text x="130.0" y="743.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6F685C" text-anchor="start" font-weight="normal" >each column is one 625 µs slot · each row one 1 MHz channel</text><line x1="130.0" y1="715.0" x2="152.2" y2="715.0" stroke="#6F685C" stroke-width="1"  stroke-linecap="round" /><line x1="130.0" y1="709.0" x2="130.0" y2="721.0" stroke="#6F685C" stroke-width="1"  stroke-linecap="round" /><line x1="152.2" y1="709.0" x2="152.2" y2="721.0" stroke="#6F685C" stroke-width="1"  stroke-linecap="round" /><text x="141.1" y="708.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >3 slots</text><text x="988.8" y="190.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="start" font-weight="bold" >LEGEND</text><rect x="989.8" y="211.0" width="16.0" height="16.0" rx="3.0" fill="#1B1A17"/><text x="1016.8" y="224.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B1A17" text-anchor="start" font-weight="normal" >1-slot packet (commands, acks)</text><rect x="989.8" y="241.0" width="16.0" height="16.0" rx="3.0" fill="#2C4FA3"/><text x="1016.8" y="254.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B1A17" text-anchor="start" font-weight="normal" >3/5-slot packet (audio)</text><rect x="989.8" y="271.0" width="16.0" height="16.0" rx="3.0" fill="#E0462F"/><text x="1016.8" y="284.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B1A17" text-anchor="start" font-weight="normal" >landed on Wi-Fi – likely lost</text><rect x="989.8" y="301.0" width="16.0" height="16.0" rx="3.0" fill="#D9A441"/><text x="1016.8" y="314.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B1A17" text-anchor="start" font-weight="normal" >Wi-Fi channel 6</text><text x="988.8" y="380.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >Classic Bluetooth never sits</text><text x="988.8" y="400.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >still. The phone (the central)</text><text x="988.8" y="420.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >and the buds hop to a new 1 MHz</text><text x="988.8" y="440.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >channel every 625 µs slot – 1600</text><text x="988.8" y="460.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >times a second – in a</text><text x="988.8" y="480.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >pseudo-random order both sides</text><text x="988.8" y="500.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >compute from the central&#x27;s</text><text x="988.8" y="520.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >address and clock. Interference</text><text x="988.8" y="540.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >only ever spoils a slot or two,</text><text x="988.8" y="560.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >and the lost packet is simply</text><text x="988.8" y="580.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >sent again on the next hop.</text><text x="988.8" y="600.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >Adaptive hopping (AFH) goes</text><text x="988.8" y="620.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >further and drops channels that</text><text x="988.8" y="640.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >keep failing. Earshot&#x27;s bytes</text><text x="988.8" y="660.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >ride this whole dance without</text><text x="988.8" y="680.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >knowing it.</text><rect x="0" y="0" width="1400" height="960" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1364.0" height="924.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1348.0" height="908.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1