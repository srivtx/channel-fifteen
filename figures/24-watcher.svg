e x1="1210.0" y1="250.0" x2="1210.0" y2="380.0" stroke="#E0462F" stroke-width="1.6"  stroke-linecap="round" /><path d="M1210.0,380.0 L1206.5,371.7 L1213.5,371.7 Z" fill="#E0462F"/><rect x="1196.0" y="386.0" width="28.0" height="28.0" rx="5.0" fill="#E0462F"/><text x="1210.0" y="446.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E0462F" text-anchor="middle" font-weight="bold" >EQ → 03</text><rect x="1336.0" y="176.0" width="28.0" height="28.0" rx="5.0" fill="#1B1A17"/><text x="1350.0" y="236.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Deep bass</text><line x1="1350.0" y1="250.0" x2="1350.0" y2="380.0" stroke="#E0462F" stroke-width="1.6"  stroke-linecap="round" /><path d="M1350.0,380.0 L1346.5,371.7 L1353.5,371.7 Z" fill="#E0462F"/><rect x="1336.0" y="386.0" width="28.0" height="28.0" rx="5.0" fill="#E0462F"/><text x="1350.0" y="446.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E0462F" text-anchor="middle" font-weight="bold" >EQ → 01</text><path d="M310.0,520.0 L310.0,527.0 L570.0,527.0 L570.0,520.0" stroke="#2C4FA3" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="440.0" y="543.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2C4FA3" text-anchor="middle" font-weight="bold" ></text><text x="440.0" y="560.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1B1A17" text-anchor="middle" font-weight="bold" >volume enhancer = command 0x0110</text><text x="440.0" y="578.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1B1A17" text-anchor="middle" font-weight="normal" >(switch 0x09 is vocal boost)</text><path d="M590.0,520.0 L590.0,527.0 L850.0,527.0 L850.0,520.0" stroke="#2E8B57" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="720.0" y="543.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2E8B57" text-anchor="middle" font-weight="bold" ></text><text x="720.0" y="560.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1B1A17" text-anchor="middle" font-weight="bold" >spatial audio = misc switch 0x1B,</text><text x="720.0" y="578.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1B1A17" text-anchor="middle" font-weight="normal" >plus type 0x041E</text><path d="M870.0,520.0 L870.0,527.0 L1410.0,527.0 L1410.0,520.0" stroke="#E0462F" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="1140.0" y="543.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#E0462F" text-anchor="middle" font-weight="bold" ></text><text x="1140.0" y="560.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1B1A17" text-anchor="middle" font-weight="bold" >EQ ids: 00 Original · 01 Deep bass · 02 Serenade · 03 Clear bass</text><text x="280.0" y="150.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >≈ 10 s apart · watcher only READS: it polls every setting and prints what moved</text><text x="70.0" y="730.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >realme Link has settings nobody had documented. Guessing could flip the wrong one, so we watched instead. With dual-device (multipoint) on, the phone and the Mac were connected at once. A</text><text x="70.0" y="750.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >small read-only program on the Mac asked the buds for every setting over and over while the user changed one thing at a time on the phone and noted the order. Every change on the phone</text><text x="70.0" y="770.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >showed up as exactly one changed value on the Mac – a perfect key. Starting state: enhancer on, spatial off, EQ Deep bass.</text><rect x="0" y="0" width="1500" height="980" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1464.0" height="944.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1448.0" height="928.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 24</text><circle cx="1448.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1437.0" y1="44.0" x2="1459.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1448.0" y1="33.0" x2="1448.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="936.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="936.0" x2="55.0" y2="936.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="925.0" x2="44.0" y2="947.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="1004.0" y="890.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="1004.0" y1="924.0" x2="1474.0" y2="924.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><line x1="1378.0" y1="890.0" x2="1378.0" y2="954.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="1016.0" y="913.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >The watcher: learning by watching</text><text x="1016.0" y="943.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot field manual · 06 · method</text><text x="1426.0" y="908.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >Plate</text><text x="1426.0" y="920.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >24 / 43</text><text x="1426.0" y="943.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#6F685C" text-anchor="middle" font-weight="normal" >watcher</text></svg>