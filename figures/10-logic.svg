xt x="160.0" y="620.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >VIL as 0; the gap in between absorbs noise, which is what makes digital robust. A clock decides when to look. Eight of these make</text><text x="160.0" y="640.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >a byte, and everything in this manual – sound, radio packets, commands – is bytes in the end.</text><rect x="0" y="0" width="1300" height="760" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1264.0" height="724.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1248.0" height="708.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 10</text><circle cx="1248.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1237.0" y1="44.0" x2="1259.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1248.0" y1="33.0" x2="1248.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="716.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="716.0" x2="55.0" y2="716.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="705.0" x2="44.0" y2="727.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="804.0" y="670.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="804.0" y1="704.0" x2="1274.0" y2="704.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" />