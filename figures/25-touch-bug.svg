ont-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2E8B57" text-anchor="middle" font-weight="bold" >next</text><text x="500.0" y="230.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#E0462F" text-anchor="start" font-weight="normal" >→ buds read gesture 01 = single tap: the wrong gesture changes</text><text x="80.0" y="388.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#2E8B57" text-anchor="start" font-weight="bold" >WHAT THE BUDS USE  (gesture is the u16 0x0201, little-endian)</text><rect x="80.0" y="400.0" width="66.0" height="66.0" rx="6" fill="#1B1A17" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="113.0" y="439.5" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="18" fill="#1B1A17" text-anchor="middle" font-weight="bold" >01</text><rect x="156.0" y="400.0" width="66.0" height="66.0" rx="6" fill="#2C4FA3" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="189.0" y="439.5" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="18" fill="#1B1A17" text-anchor="middle" font-weight="bold" >01</text><rect x="232.0" y="400.0" width="66.0" height="66.0" rx="6" fill="#2E8B57" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="265.0" y="439.5" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="18" fill="#1B1A17" text-anchor="middle" font-weight="bold" >01</text><rect x="308.0" y="400.0" width="66.0" height="66.0" rx="6" fill="#2E8B57" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="341.0" y="439.5" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="18" fill="#1B1A17" text-anchor="middle" font-weight="bold" >02</text><rect x="384.0" y="400.0" width="66.0" height="66.0" rx="6" fill="#2E8B57" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="417.0" y="439.5" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="18" fill="#1B1A17" text-anchor="middle" font-weight="bold" >06</text><path d="M80.0,472.0 L80.0,479.0 L146.0,479.0 L146.0,472.0" stroke="#1B1A17" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="113.0" y="495.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >count</text><line x1="189.0" y1="474.0" x2="189.0" y2="508.0" stroke="#2C4FA3" stroke-width="1" stroke-dasharray="2 3" stroke-linecap="round" /><path d="M156.0,506.0 L156.0,513.0 L222.0,513.0 L222.0,506.0" stroke="#2C4FA3" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="189.0" y="529.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2C4FA3" text-anchor="middle" font-weight="bold" >left</text><path d="M232.0,472.0 L232.0,479.0 L374.0,479.0 L374.0,472.0" stroke="#2E8B57" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="303.0" y="495.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2E8B57" text-anchor="middle" font-weight="bold" >01 · double (02)</text><line x1="417.0" y1="474.0" x2="417.0" y2="508.0" stroke="#2E8B57" stroke-width="1" stroke-dasharray="2 3" stroke-linecap="round" /><path d="M384.0,506.0 L384.0,513.0 L450.0,513.0 L450.0,506.0" stroke="#2E8B57" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="417.0" y="529.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2E8B57" text-anchor="middle" font-weight="bold" >next</text><circle cx="1110" cy="400" r="140" fill="none" stroke="#1B1A17" stroke-width="1.4" stroke-dasharray="4 5"/><circle cx="1110.0" cy="260.0" r="34" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.8"/><text x="1110.0" y="265.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >change</text><text x="1110.0" y="216.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >send a set command</text><circle cx="1250.0" cy="400.0" r="34" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.8"/><text x="1250.0" y="405.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >read back</text><text x="1250.0" y="452.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >ask for all bindings</text><circle cx="1110.0" cy="540.0" r="34" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.8"/><text x="1110.0" y="545.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >compare</text><text x="1110.0" y="592.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >only that entry moved?</text><circle cx="970.0" cy="400.0" r="34" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.8"/><text x="970.0" y="405.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >revert</text><text x="970.0" y="356.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >put it back as it was</text><text x="80.0" y="640.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >The tap layout came from Gadgetbridge&#x27;s code, but the byte order was easy to misread. Instead of trusting it, every write was tested on the real buds with the same loop:</text><text x="80.0" y="660.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >change one thing, read the whole table back, check that exactly that entry moved, then revert. The loop caught that the first encoder would have set the wrong gesture for</text><text x="80.0" y="680.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >double, triple and hold. With the fix, “left triple tap: Next → Previous” came back as 03 05 in the reply, nothing else moved, and the revert restored 03 06. Earshot</text><text x="80.0" y="700.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >keeps doing a light version forever: after any tap change it reads the bindings back, so the screen always shows what the buds really hold.</text><rect x="0" y="0" width="1400" height="1000" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1364.0" height="964.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1348.0" height="948.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 25</text><circle cx="1348.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1337.0" y1="44.0" x2="1359.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1348.0" y1="33.0" x2="1348.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="956.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="956.0" x2="55.0" y2="956.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="945.0" x2="44.0" y2="967.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="904.0" y="910.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="904.0" y1="944.0" x2="1374.0" y2="944.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><line x1="1278.0" y1="910.0" x2="1278.0" y2="974.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="916.0" y="933.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >Change, read back, revert: catching a bug</text><text x="916.0" y="963.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot field manual · 06 · method</text><text x="1326.0" y="928.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >Plate</text><text x="1326.0" y="940.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >25 / 43</text><text x="1326.0" y="963.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#6F685C" text-anchor="middle" font-weight="normal" >touch-bug</text></svg>