<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000"><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 -1.6 1.05"/></filter><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.05" fill="#1B1A17"/></pattern></defs><rect x="0.0" y="0.0" width="1400.0" height="1000.0" rx="0" fill="#EFE8D8" stroke="none" stroke-width="0" /><text x="80.0" y="140.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="bold" >SET “LEFT DOUBLE TAP → NEXT”  (command 0x0401)</text><text x="80.0" y="178.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#E0462F" text-anchor="start" font-weight="bold" >FIRST GUESS</text><rect x="80.0" y="190.0" width="66.0" height="66.0" rx="6" fill="#1B1A17" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="113.0" y="229.5" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="18" fill="#1B1A17" text-anchor="middle" font-weight="bold" >01</text><rect x="156.0" y="190.0" width="66.0" height="66.0" rx="6" fill="#2C4FA3" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="189.0" y="229.5" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="18" fill="#1B1A17" text-anchor="middle" font-weight="bold" >01</text><rect x="232.0" y="190.0" width="66.0" height="66.0" rx="6" fill="#E0462F" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="265.0" y="229.5" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="18" fill="#1B1A17" text-anchor="middle" font-weight="bold" >02</text><rect x="308.0" y="190.0" width="66.0" height="66.0" rx="6" fill="#E