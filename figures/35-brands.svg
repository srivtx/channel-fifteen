D31-… + model</text><rect x="1141.0" y="557.0" width="20.0" height="20.0" rx="5.0" fill="#2C4FA3"/><rect x="1191.0" y="557.0" width="20.0" height="20.0" rx="5.0" fill="#2C4FA3"/><rect x="1241.0" y="557.0" width="20.0" height="20.0" rx="5.0" fill="#2C4FA3"/><rect x="1291.0" y="557.0" width="20.0" height="20.0" rx="5.0" fill="#E4DBC6"/><rect x="1341.0" y="557.0" width="20.0" height="20.0" rx="5.0" fill="#E4DBC6"/><rect x="1391.0" y="557.0" width="20.0" height="20.0" rx="5.0" fill="#2C4FA3"/><text x="80.0" y="700.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >Under the dialects it is one idea: a start marker, a length, a command, a payload, sometimes a checksum. Earshot captures that in the Driver protocol – start(), encode(intent),</text><text x="80.0" y="720.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >frame(message), receive(bytes) – so the app never knows which brand it is talking to. Each brand&#x27;s layouts come from open projects (Gadgetbridge, GalaxyBudsClient) and their captured test</text><text x="80.0" y="740.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >messages.</text><rect x="0" y="0" width="1500" height="900" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1464.0" height="864.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1448.0" height="848.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 35</text><circle cx="1448.0"