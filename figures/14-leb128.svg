ation Mono', monospace" font-size="15" fill="#1B1A17" text-anchor="middle" font-weight="bold" >C8</text><rect x="588.0" y="670.0" width="46.0" height="46.0" rx="6" fill="#2C4FA3" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="611.0" y="698.4" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1B1A17" text-anchor="middle" font-weight="bold" >00</text><path d="M120.0,722.0 L120.0,729.0 L166.0,729.0 L166.0,722.0" stroke="#1B1A17" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="143.0" y="745.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >AA</text><path d="M172.0,722.0 L172.0,729.0 L270.0,729.0 L270.0,722.0" stroke="#E0462F" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="221.0" y="745.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#E0462F" text-anchor="middle" font-weight="bold" >len 207</text><path d="M276.0,722.0 L276.0,729.0 L634.0,729.0 L634.0,722.0" stroke="#2C4FA3" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="455.0" y="745.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2C4FA3" text-anchor="middle" font-weight="bold" >rest of the frame…</text><text x="120.0" y="790.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >realme/OPPO frames say how long they are with LEB128 (“little-endian base 128”), the same scheme WebAssembly and protobuf use. Short frames</text><text x="120.0" y="810.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >– almost all of them – spend one byte on the length; long ones grow a second. Earshot&#x27;s test encodesLongFrameLengthAsLEB128 checks exactly</text><text x="120.0" y="830.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >this case: a 200-byte payload makes a 207-byte frame, written AA CF 01.</text><rect x="0" y="0" width="1300" height="960" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1264.0" height="924.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1248.0" height="908.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 14</text><circle cx="1248.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1237.0" y1="44.0" x2="1259.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1248.0" y1="33.0" x2="1248.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="916.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="916.0" x2="55.0" y2="916.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="905.0" x2="44.0" y2="927.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="804.0" y="870.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="804.0" y1="904.0" x2="1274.0" y2="904.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><line x1="1178.0" y1="870.0" x2="1178.0" y2="934.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="816.0" y="893.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >LEB128: a length that grows when it must</text><text x="816.0" y="923.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot field manual · 02 · signals to bits</text><text x="1226.0" y="888.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >Plate</text><text x="1226.0" y="900.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >14 / 43</text><text x="1226.0" y="923.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#6F685C" text-anchor="middle" font-weight="normal" >leb128</text></svg>