ration Mono', monospace" font-size="22" fill="#1B1A17" text-anchor="middle" font-weight="bold" >01</text><path d="M120.0,536.0 L120.0,543.0 L250.0,543.0 L250.0,536.0" stroke="#E0462F" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="185.0" y="559.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#E0462F" text-anchor="middle" font-weight="bold" >1|1001111 = CF</text><text x="185.0" y="574.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >more follows</text><path d="M280.0,536.0 L280.0,543.0 L410.0,543.0 L410.0,536.0" stroke="#2C4FA3" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="345.0" y="559.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2C4FA3" text-anchor="middle" font-weight="bold" >0|0000001 = 01</text><text x="345.0" y="574.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >last byte</text><text x="120.0" y="650.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="bold" >ON THE WIRE</text><rect x="120.0" y="670.0" width="46.0" height="46.0" rx="6" fill="#1B1A17" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="143.0" y="698.4" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1B1A17" text-anchor="middle" font-weight="bold" >AA</text><rect x="172.0" y="670.0" width="46.0" height="46.0" rx="6" fill="#E0462F" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="195.0" y="698.4" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1B1A17" text-anchor="middle" font-weight="bold" >CF</text><rect x="224.0" y="670.0" width="46.0" height="46.0" rx="6"