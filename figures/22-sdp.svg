<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960"><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 -1.6 1.05"/></filter><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.05" fill="#1B1A17"/></pattern></defs><rect x="0.0" y="0.0" width="1400.0" height="960.0" rx="0" fill="#EFE8D8" stroke="none" stroke-width="0" /><rect x="90.0" y="150.0" width="760.0" height="520.0" rx="10" fill="#1B1A17" stroke="none" stroke-width="0" /><rect x="80.0" y="140.0" width="760.0" height="520.0" rx="10" fill="#EFE8D8" stroke="#1B1A17" stroke-width="2" /><line x1="124.0" y1="140.0" x2="124.0" y2="660.0" stroke="#E0462F" stroke-width="1"  stroke-linecap="round" /><text x="144.0" y="180.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#1B1A17" text-anchor="start" font-weight="bold" >SDP SERVICE RECORD</text><text x="820.0" y="180.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6F685C" text-anchor="end" font-weight="normal" >card 7 of 9</text><line x1="124.0" y1="270.0" x2="840.0" y2="270.0" stroke="#B4AB99" stroke-width="0.8"  stroke-linecap="round" /><text x="144.0" y="240.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6F685C" text-anchor="start" font-weight="normal" >0x0000</text><text x="230.0" y="240.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >ServiceRecordHandle</text><text x="230.0" y="262.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="bold" >0x0001000B  (any number; per device)</text><line x1="124.0" y1="352.0" x2="840.0" y2="352.0" stroke="#B4AB99" stroke-width="0.8"  stroke-linecap="round" /><text x="144.0" y="322.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6F685C" text-anchor="start" font-weight="normal" >0x0001</text><text x="230.0" y="322.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >ServiceClassIDList</text><text x="230.0" y="344.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E0462F" text-anchor="start" font-weight="bold" >UUID-128  0000079A-D102-11E1-9B23-00025B00A5A5</text><line x1="124.0" y1="434.0" x2="840.0" y2="434.0" stroke="#B4AB99" stroke-width="0.8"  stroke-linecap="round" /><text x="144.0" y="404.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6F685C" text-anchor="start" font-weight="normal" >0x0004</text><text x="230.0" y="404.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >ProtocolDescriptorList</text><text x="230.0" y="426.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#2C4FA3" text-anchor="start" font-weight="bold" >L2CAP (0x0100)  →  RFCOMM (0x0003), channel 15</text><line x1="124.0" y1="516.0" x2="840.0" y2="516.0" stroke="#B4AB99" stroke-width="0.8"  stroke-linecap="round" /><text x="144.0" y="486.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6F685C" text-anchor="start" font-weight="normal" >0x0005</text><text x="230.0" y="486.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >BrowseGroupList</text><text x="230.0" y="508.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="bold" >public browse root (0x1002)</text><line x1="124.0" y1="598.0" x2="840.0" y2="598.0" stroke="#B4AB99" stroke-width="0.8"  stroke-linecap="round" /><text x="144.0" y="568.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6F685C" text-anchor="start" font-weight="normal" >0x0100</text><text x="230.0" y="568.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >ServiceName</text><text x="230.0" y="590.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#2E8B57" text-anchor="start" font-weight="bold" >&quot;oppointeraction&quot;</text><text x="900.0" y="160.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="bold" >WHAT EARSHOT DOES</text><rect x="900.0" y="180.0" width="440.0" height="290.0" rx="10" fill="#1B1A17" stroke="none" stroke-width="0" /><text x="920.0" y="214.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#EFE8D8" text-anchor="start" font-weight="normal" >for record in device.services {</text><text x="920.0" y="236.8" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#EFE8D8" text-anchor="start" font-weight="normal" >  let classes = record</text><text x="920.0" y="259.5" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#EFE8D8" text-anchor="start" font-weight="normal" >    .getAttributeDataElement(0x0001)</text><text x="920.0" y="282.2" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#EFE8D8" text-anchor="start" font-weight="normal" >  if classes contain the brand&#x27;s UUID {</text><text x="920.0" y="305.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#EFE8D8" text-anchor="start" font-weight="normal" >    record.getRFCOMMChannelID(&amp;id)</text><text x="920.0" y="327.8" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#EFE8D8" text-anchor="start" font-weight="normal" >    return id          // 15</text><text x="920.0" y="350.5" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#EFE8D8" text-anchor="start" font-weight="normal" >  }</text><text x="920.0" y="373.2" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#EFE8D8" text-anchor="start" font-weight="normal" >}</text><text x="920.0" y="396.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#EFE8D8" text-anchor="start" font-weight="normal" >// not cached yet? performSDPQuery,</text><text x="920.0" y="418.8" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#EFE8D8" text-anchor="start" font-weight="normal" >// then fall back to 15 for realme</text><text x="900.0" y="520.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="bold" >SHORT UUIDS GROW TO 128 BITS</text><text x="900.0" y="548.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >0x1101  (Serial Port)</text><text x="900.0" y="570.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#2C4FA3" text-anchor="start" font-weight="normal" >→ 00001101-0000-1000-8000-00805F9B34FB</text><text x="900.0" y="596.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot compares all of them at 16 bytes.</text><text x="80.0" y="720.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >SDP – the Service Discovery Protocol – is the buds&#x27; table of contents. Each record says what a service is (a UUID) and how to reach it (protocol stack and channel</text><text x="80.0" y="740.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >number). macOS caches these records when you pair, and IOBluetooth hands them to any app. The realme Buds Air 7 advertise their control service on RFCOMM channel 15 under</text><text x="80.0" y="760.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >the name “oppointeraction”; Samsung, Sony, Nothing and soundcore each use their own UUID, listed in Earshot&#x27;s Profiles.swift.</text><rect x="0" y="0" width="1400" height="960" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1364.0" height="924.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1348.0" height="908.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 22</text><circle cx="1348.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1337.0" y1="44.0" x2="1359.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1348.0" y1="33.0" x2="1348.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="916.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="916.0" x2="55.0" y2="916.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="905.0" x2="44.0" y2="927.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="904.0" y="870.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="904.0" y1="904.0" x2="1374.0" y2="904.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><line x1="1278.0" y1="870.0" x2="1278.0" y2="934.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="916.0" y="893.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >Reading the buds&#x27; service records</text><text x="916.0" y="923.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot field manual · 05 · macOS</text><text x="1326.0" y="888.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >Plate</text><text x="1326.0" y="900.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >22 / 43</text><text x="1326.0" y="923.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#6F685C" text-anchor="middle" font-weight="normal" >sdp</text></svg>