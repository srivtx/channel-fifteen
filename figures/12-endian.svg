<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" width="1300" height="800"><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 -1.6 1.05"/></filter><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.05" fill="#1B1A17"/></pattern></defs><rect x="0.0" y="0.0" width="1300.0" height="800.0" rx="0" fill="#EFE8D8" stroke="none" stroke-width="0" /><text x="120.0" y="150.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >THE NUMBER 0x0106  (= 262, realme&#x27;s “battery” command)</text><text x="120.0" y="300.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#1B1A17" text-anchor="start" font-weight="normal" ></text><rect x="160.0" y="200.0" width="64.0" height="64.0" rx="6" fill="#E0462F" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="192.0" y="239.2" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="20" fill="#1B1A17" text-anchor="middle" font-weight="bold" >06</text><rect x="232.0" y="200.0" width="64.0" height="64.0" rx="6" fill="#2C4FA3" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="264.0" y="239.2" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="20" fill="#1B1A17" text-anchor="middle" font-weight="bold" >01</text><path d="M160.0,270.0 L160.0,277.0 L224.0,277.0 L224.0,270.0" stroke="#E0462F" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="192.0" y="293.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#E0462F" text-anchor="middle" font-weight="bold" >low byte first</text><path d="M232.0,270.0 L232.0,277.0 L296.0,277.0 L296.0,270.0" stroke="#2C4FA3" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="264.0" y="293.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2C4FA3" text-anchor="middle" font-weight="bold" >then high</text><text x="330.0" y="240.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="bold" >LITTLE-ENDIAN – OPO, Samsung, Nothing, soundcore</text><rect x="160.0" y="360.0" width="64.0" height="64.0" rx="6" fill="#2C4FA3" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="192.0" y="399.2" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="20" fill="#1B1A17" text-anchor="middle" font-weight="bold" >01</text><rect x="232.0" y="360.0" width="64.0" height="64.0" rx="6" fill="#E0462F" stroke="#1B1A17" stroke-width="1.4" fill-opacity="0.22"/><text x="264.0" y="399.2" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="20" fill="#1B1A17" text-anchor="middle" font-weight="bold" >06</text><path d="M160.0,430.0 L160.0,437.0 L224.0,437.0 L224.0,430.0" stroke="#2C4FA3" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="192.0" y="453.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2C4FA3" text-anchor="middle" font-weight="bold" >high byte first</text><path d="M232.0,430.0 L232.0,437.0 L296.0,437.0 L296.0,430.0" stroke="#E0462F" stroke-width="1.2" fill="none"  stroke-linejoin="round" stroke-linecap="round" /><text x="264.0" y="453.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#E0462F" text-anchor="middle" font-weight="bold" >then low</text><text x="330.0" y="400.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="bold" >BIG-ENDIAN – “network order”; Sony&#x27;s length field</text><text x="120.0" y="530.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >A REPLY SETS THE TOP BIT</text><text x="120.0" y="562.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#E0462F" text-anchor="start" font-weight="bold" >0x0106  |  0x8000  =  0x8106    →  sent as  06 81</text><text x="120.0" y="610.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >A number bigger than 255 needs more than one byte, and someone has to decide the order. Most chips, including the ARM cores in earbuds and</text><text x="120.0" y="630.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >Macs, store the low byte first (little-endian), so most of these protocols send it that way too. Read a capture wrong-way-round and 0x0106</text><text x="120.0" y="650.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >becomes 0x0601 – a command that does not exist. Earshot spells it out with helpers like u16(lo, hi) and littleEndianBytes.</text><rect x="0" y="0" width="1300" height="800" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1264.0" height="764.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1248.0" height="748.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 12</text><circle cx="1248.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1237.0" y1="44.0" x2="1259.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1248.0" y1="33.0" x2="1248.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="756.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="756.0" x2="55.0" y2="756.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="745.0" x2="44.0" y2="767.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="804.0" y="710.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="804.0" y1="744.0" x2="1274.0" y2="744.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><line x1="1178.0" y1="710.0" x2="1178.0" y2="774.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="816.0" y="733.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >Byte order: which end comes first</text><text x="816.0" y="763.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot field manual · 02 · signals to bits</text><text x="1226.0" y="728.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >Plate</text><text x="1226.0" y="740.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >12 / 43</text><text x="1226.0" y="763.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#6F685C" text-anchor="middle" font-weight="normal" >endian</text></svg>