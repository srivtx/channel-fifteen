solas, 'Liberation Mono', monospace" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >owns the link</text><rect x="870.0" y="416.0" width="180.0" height="68.0" rx="10" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.6" /><text x="960.0" y="446.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Secondary bud</text><text x="960.0" y="466.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >listens in</text><line x1="800.0" y1="266.0" x2="700.0" y2="414.0" stroke="#2C4FA3" stroke-width="2.2"  stroke-linecap="round" /><path d="M700.0,414.0 L701.7,405.2 L707.5,409.1 Z" fill="#2C4FA3"/><path d="M840,266 L940,414" stroke="#E0462F" stroke-width="2" fill="none" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round" /><text x="900.0" y="330.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#E0462F" text-anchor="start" font-weight="normal" >eavesdrops on the same hops</text><path d="M770,470 L870,470" stroke="#1B1A17" stroke-width="1.4" fill="none" stroke-dasharray="3 4" stroke-linejoin="round" stroke-linecap="round" /><text x="820.0" y="494.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >sync + acks</text><text x="1150.0" y="130.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="bold" >A PICONET</text><line x1="1240.0" y1="300.0" x2="1330.0" y2="300.0" stroke="#B4AB99" stroke-width="1"  stroke-linecap="round" /><circle cx="1330.0" cy="300.0" r="9" fill="#2C4FA3" stroke="#1B1A17" stroke-width="1.2"/><line x1="1240.0" y1="300.0" x2="1296.1" y2="370.4" stroke="#B4AB99" stroke-width="1"  stroke-linecap="round" /><circle cx="1296.1" cy="370.4" r="9" fill="#2C4FA3" stroke="#1B1A17" stroke-width="1.2"/><line x1="1240.0" y1="300.0" x2="1220.0" y2="387.7" stroke="#B4AB99" stroke-width="1"  stroke-linecap="round" /><circle cx="1220.0" cy="387.7" r="9" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.2"/><line x1="1240.0" y1="300.0" x2="1158.9" y2="339.0" stroke="#B4AB99" stroke-width="1"  stroke-linecap="round" /><circle cx="1158.9" cy="339.0" r="9" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.2"/><line x1="1240.0" y1="300.0" x2="1158.9" y2="261.0" stroke="#B4AB99" stroke-width="1"  stroke-linecap="round" /><circle cx="1158.9" cy="261.0" r="9" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.2"/><line x1="1240.0" y1="300.0" x2="1220.0" y2="212.3" stroke="#B4AB99" stroke-width="1"  stroke-linecap="round" /><circle cx="1220.0" cy="212.3" r="9" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.2"/><line x1="1240.0" y1="300.0" x2="1296.1" y2="229.6" stroke="#B4AB99" stroke-width="1"  stroke-linecap="round" /><circle cx="1296.1" cy="229.6" r="9" fill="#E4DBC6" stroke="#1B1A17" stroke-width="1.2"/><circle cx="1240.0" cy="300.0" r="16" fill="#E0462F" stroke="#1B1A17" stroke-width="1.4"/><text x="1240.0" y="425.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#1B1A17" text-anchor="middle" font-weight="normal" >1 central, ≤ 7 active peripherals</text><text x="1240.0" y="445.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >all hopping on the central&#x27;s clock</text><text x="1150.0" y="520.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="start" font-weight="bold" >EVERY RADIO HAS A BD_ADDR</text><text x="1150.0" y="546.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#E0462F" text-anchor="start" font-weight="bold" >xx:xx:xx:xx:xx:xx</text><text x="1150.0" y="568.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6F685C" text-anchor="start" font-weight="normal" >48 bits; top 24 name the maker</text><text x="110.0" y="720.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >Your Mac only ever talks to one bud – the primary. When Earshot changes the noise mode, the primary applies it and passes it to its twin over their own link.</text><text x="110.0" y="740.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >That is also why the buds can refuse a command (status 0x0E) when neither is in an ear, and why a reply can lack the right bud&#x27;s battery: it is asleep, not</text><text x="110.0" y="760.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >lost.</text><rect x="0" y="0" width="1400" height="900" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1364.0" height="864.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1348.0" height="848.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 18</text><circle cx="1348.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1337.0" y1="44.0" x2="1359.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1348.0" y1="33.0" x2="1348.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="856.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="856.0" x2="55.0" y2="856.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="845.0" x2="44.0" y2="867.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="904.0" y="810.0" width="470.0" height="64.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><line x1="904.0" y1="844.0" x2="1374.0" y2="844.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><line x1="1278.0" y1="810.0" x2="1278.0" y2="874.0" stroke="#1B1A17" stroke-width="1"  stroke-linecap="round" /><text x="916.0" y="833.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1B1A17" text-anchor="start" font-weight="bold" >Piconets and how two buds share one phone</text><text x="916.0" y="863.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F685C" text-anchor="start" font-weight="normal" >Earshot field manual · 03 · radio</text><text x="1326.0" y="828.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6F685C" text-anchor="middle" font-weight="normal" >Plate</text><text x="1326.0" y="840.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1B1A17" text-anchor="middle" font-weight="bold" >18 / 43</text><text x="1326.0" y="863.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#6F685C" text-anchor="middle" font-weight="normal" >tws</text></svg>