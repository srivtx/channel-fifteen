rif" font-size="13" fill="#6F685C" text-anchor="start" font-weight="normal" >← the only place errors appear</text><text x="80.0" y="880.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >BudsStore keeps pendingNoiseMode / pendingAncLevel / pendingEq next to the confirmed values and shows the pending one, so taps feel instant. The driver reports .applied, .refused(code) or</text><text x="80.0" y="900.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >the link reports a failure; the store then settles or rolls back. No pop-ups, no toasts.</text><rect x="0" y="0" width="1500" height="980" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1464.0" height="944.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="2.2" /><rect x="26.0" y="26.0" width="1448.0" height="928.0" rx="0" fill="none" stroke="#1B1A17" stroke-width="0.8" /><rect x="26.0" y="26.0" width="96.0" height="34.0" rx="0" fill="#EFE8D8" stroke="#1B1A17" stroke-width="1.6" /><text x="74.0" y="49.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1B1A17" text-anchor="middle" font-weight="bold" >Fig. 39</text><circle cx="1448.0" cy="44.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="1437.0" y1="44.0" x2="1459.0" y2="44.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="1448.0" y1="33.0" x2="1448.0" y2="55.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><circle cx="44.0" cy="936.0" r="7" fill="none" stroke="#1B1A17" stroke-width="1"/><line x1="33.0" y1="936.0" x2="55.0" y2="936.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><line x1="44.0" y1="925.0" x2="44.0" y2="947.0" stroke="#1B1A17" stroke-width="0.8"  stroke-linecap="round" /><rect x="1004.0" y="890.0" width="470.0" height="64.0" rx