rect x="1237.3" y="601.5" width="13.0" height="13.0" rx="3.0" fill="#E0462F"/><text x="120.0" y="716.0" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#2E8B57" text-anchor="start" font-weight="bold" >BLUETOOTH LOW ENERGY – 40 channels × 2 MHz · red: advertising 37, 38, 39</text><rect x="752.1" y="330.0" width="210.7" height="250.0" rx="0" fill="url(#dots)" stroke="none" stroke-width="0" opacity="0.35"/><text x="850.5" y="320.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6F685C" text-anchor="middle" font-weight="normal" >microwave ovens</text><text x="120.0" y="140.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >Radio is electromagnetic waves: electric and magnetic fields swinging back and forth, travelling at the speed of light. At 2.4 GHz they swing 2.4</text><text x="120.0" y="160.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >billion times a second and each wave is about 12.5 cm long – short enough for a millimetre-scale antenna in a stem to work. This band is free for</text><text x="120.0" y="180.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1B1A17" text-anchor="start" font-weight="normal" >anyone to use without a licence (ISM), so Bluetooth shares it with Wi-Fi, baby monitors and microwave ovens.</text><text x="120.0" y="790.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1B1A17" text-anchor="start" font-weight="normal" >Your audio and Earshot&#x27;s commands travel on the blue channels: the buds speak Bluetooth Classic.</text><rect x="0" y="0" width="1400" height="860" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/><rect x="18.0" y="18.0" width="1364.0" height="824.0" rx="0" fill="none" stroke="#1B1A17" st